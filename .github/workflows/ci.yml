name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ОР-8: значения с точками передаются в кавычках.
  CMAKE_VERSION_ARG: ""

jobs:
  # ---------------------------------------------------------------------------
  # Блокирующие предполётные проверки (§8.3, §8.4)
  # ---------------------------------------------------------------------------

  lint-cmake:
    name: lint-cmake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CMake syntax / ${VAR[0]} / quotes
        run: python .github/scripts/check_cmake.py

  lint-version:
    name: lint-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Version consistency (7 files)
        run: node .github/scripts/check-version.mjs

  web:
    name: web (widget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Widget structure and size
        run: node .github/scripts/check-widget.mjs
      - name: Widget parser behavior
        run: node .github/scripts/check-widget-parse.mjs
      - name: Artifact size guard
        run: |
          bytes=$(wc -c < native/data/widget.html)
          echo "widget.html size: $bytes bytes"
          if [ "$bytes" -gt 307200 ]; then
            echo "::error::widget.html exceeds 300 KiB"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Нативная сборка yawametrics.dll
  # ---------------------------------------------------------------------------

  native:
    name: native (yawametrics.dll)
    needs: [lint-cmake, lint-version, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from CHANGELOG
        id: version
        shell: pwsh
        run: |
          $version = node .github/scripts/version.mjs
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: native/.deps
          key: obsdeps-windows-x64-${{ hashFiles('native/buildspec.json', 'scripts/Install-ObsDeps.ps1') }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install OBS dependencies
        shell: pwsh
        run: ./scripts/Install-ObsDeps.ps1

      - name: Configure (cmake preset)
        shell: pwsh
        run: cmake --preset windows-ci-x64 "-DYAWAMETRICS_VERSION=${{ steps.version.outputs.version }}"

      - name: Build (yawametrics.dll)
        run: cmake --build --preset windows-ci-x64

      - name: Qt compatibility gate (qt_version_tag <= 6.6)
        # OBS 30.0–32.2.2 поставляет Qt 6.6–6.11: плагин обязан собираться
        # с Qt не новее 6.6, иначе он не загрузится в старых сборках OBS
        # (подробности и матрица Qt — в шапке check-qt-compat.ps1).
        shell: pwsh
        run: .github/scripts/check-qt-compat.ps1 -SearchRoot "native/.build" -MaxQtMajor 6 -MaxQtMinor 6

      - name: Package manual-install ZIP (§9.1)
        shell: pwsh
        run: .github/scripts/package-zip.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: yawametrics-windows-x64-zip
          path: package/yawametrics-*-windows-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Релиз: тег vX.Y.Z + ZIP (всегда) + .exe (best-effort, §9.2, §10)
  # ---------------------------------------------------------------------------

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract version from CHANGELOG
        id: version
        shell: pwsh
        run: |
          $version = node .github/scripts/version.mjs
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: yawametrics-windows-x64-zip
          path: package

      # §9.2: сбой сборки .exe не должен отменять релиз.
      - name: Build .exe installer (best-effort)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = Get-ChildItem "package\yawametrics-*-windows-x64.zip" | Select-Object -First 1
          $staging = Join-Path $env:RUNNER_TEMP "staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $staging -Force

          # Inno Setup ставится напрямую с официального релиза jrsoftware:
          # Chocolatey не гарантирован на образах windows-latest (миграция
          # на Windows Server 2025 / VS 2026) и choco install уже падал.
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $innoInstaller -UseBasicParsing
          Start-Process -FilePath $innoInstaller -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          $outputDir = Join-Path $env:RUNNER_TEMP "installer-out"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          # ОР-7: опции iscc передаются до имени скрипта.
          & $iscc "/DMyAppVersion=$version" "/DStagingDir=$staging" "/O$outputDir" "installer\YawaMetrics.iss"
          if ($LASTEXITCODE -ne 0) { throw "iscc failed (exit code $LASTEXITCODE)" }

          $exe = Get-ChildItem $outputDir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer was not produced" }
          Copy-Item $exe.FullName "package\"
          "exeName=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = (Get-ChildItem "package\yawametrics-*-windows-x64.zip" | Select-Object -First 1).FullName
          if (-not $zip) { throw "ZIP kit not found" }

          $existing = & gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            gh release create $tag $zip --title "YawaMetrics $version" --generate-notes --target main
          } else {
            Write-Host "Release $tag already exists — uploading assets"
            gh release upload $tag $zip --clobber
          }

      - name: Attach .exe installer (if built)
        if: always() && steps.installer.outputs.exeName != ''
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $exe = "package\${{ steps.installer.outputs.exeName }}"
          if (Test-Path $exe) {
            gh release upload $tag $exe --clobber
          }
